version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: swe573-postgres
    environment:
      POSTGRES_DB: connect_the_dots_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swe573
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: swe573-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: 